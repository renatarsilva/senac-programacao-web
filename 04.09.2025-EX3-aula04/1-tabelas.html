<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
  </head>
  <body>
    <section>
      <h1>A</h1>
      <table border="3">
        <tr>
          <th rowspan="3">Célula 1</th>
          <th>Célula 2</th>
        </tr>
        <tr>
          <th>célula 3</th>
        </tr>
        <tr>
          <th>Célula 4</th>
        </tr>
      </table>
      <hr />
    </section>
    <section>
      <h1>B</h1>
      <table border="2">
        <tr>
          <th colspan="2">célula 1</th>
          <th>Célula 2</th>
        </tr>
        <tr>
          <th>Célula 3</th>
          <th>Célula 4</th>
          <th>Célula 5</th>
        </tr>
      </table>
    </section>
    <hr />
    <section>
      <h1>C</h1>
      <table border="1">
        <tr>
          <th>Peças</th>
          <th>Preço</th>
          <th rowspan="2">INFORMÁTICA</th>
        </tr>
        <tr>
          <th>HD</th>
          <th>300,00</th>
        </tr>
      </table>
      <hr />
    </section>
  </body>
</html>
