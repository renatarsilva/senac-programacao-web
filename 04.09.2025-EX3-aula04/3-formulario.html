<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Manutenção de Usuários</title>
  </head>
  <body>
    <header>
      <h3>MANUTENÇÃO DE USUÁRIOS DO SISTEMA INTERNO</h3>
    </header>
    <main>
      <form>
        <label for="login">Login</label>
        <input type="text" id="login" name="login" /><br /><br />

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" /><br /><br />

        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="ativo">Ativo</option>
          <option value="inativo" selected>Inativo</option></select
        ><br /><br />

        <label>Tipo</label>
        <input type="radio" name="tipo" value="tecnico" /> Técnico
        <input type="radio" name="tipo" value="professor" /> Professor
        <input type="radio" name="tipo" value="aluno" /> Aluno<br /><br />

        <label for="data">Data Criação</label>
        <input type="date" id="data" name="data" /><br /><br />

        <label>Perfil</label>
        <input type="radio" name="perfil" value="convidado" /> Convidado
        <input type="radio" name="perfil" value="administrador" />
        Administrador<br /><br />

        <label for="obs">Observações</label><br />
        <textarea id="obs" name="obs" rows="5" cols="40"></textarea><br /><br />

        <label>Módulos</label><br />
        <input type="checkbox" name="modulos" value="compras" /> Compras
        <input type="checkbox" name="modulos" value="biblioteca" /> Biblioteca
        <input type="checkbox" name="modulos" value="academico" /> Acadêmico
        <br />
        <input type="checkbox" name="modulos" value="documentacao" />
        Documentação
        <input type="checkbox" name="modulos" value="rh" /> Recursos Humanos<br /><br />

        <input type="submit" value="Cadastrar" />
        <input type="reset" value="Excluir" />
      </form>
    </main>
  </body>
</html>
