<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Identificação do Usuário</title>
  </head>
  <body>
    <h2>Identificação do Usuário</h2>

    <form>
      <label for="nome">Nome*:</label>
      <input type="text" id="nome" name="nome" required /><br /><br />

      <label for="senha">Senha*:</label>
      <input type="password" id="senha" name="senha" required /><br /><br />

      <label for="cpf">CPF*:</label>
      <input type="text" id="cpf" name="cpf" required /><br /><br />

      <label>Sexo*:</label><br />
      <input type="radio" name="sexo" value="masculino" required />
      Masculino<br />
      <input type="radio" name="sexo" value="feminino" /> Feminino<br /><br />

      <label for="data">Data Nascimento*:</label>
      <input type="date" id="data" name="data" required /><br /><br />

      <label for="estado">Estado Civil*:</label>
      <select id="estado" name="estado" required>
        <option value="">Selecione...</option>
        <option value="solteiro">Solteiro(a)</option>
        <option value="casado">Casado(a)</option>
        <option value="divorciado">Divorciado(a)</option>
        <option value="viuvo">Viúvo(a)</option></select
      ><br /><br />

      <label for="escolaridade">Escolaridade:</label>
      <select id="escolaridade" name="escolaridade">
        <option value="">Selecione...</option>
        <option value="fundamental">Fundamental</option>
        <option value="medio">Médio</option>
        <option value="superior">Superior</option>
        <option value="pos">Pós-graduação</option></select
      ><br /><br />

      <label for="ocupacao">Ocupação Principal:</label>
      <input type="text" id="ocupacao" name="ocupacao" /><br /><br />

      <input type="submit" value="Cadastrar" />
      <input type="reset" value="Limpar" />
    </form>
  </body>
</html>
