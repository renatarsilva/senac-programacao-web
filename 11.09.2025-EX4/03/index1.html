<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Teste de Fontes</title>
    <style>
      /* a. Tipo de letra Arial e cor vermelha */
      #fonte-arial-vermelha {
        font-family: Arial, sans-serif;
        color: red;
      }

      /* b. Tipo de letra Times, com tamanho 22 e na cor verde */
      #fonte-times-verde {
        font-family: "Times New Roman", Times, serif;
        font-size: 22px;
        color: green;
      }

      /* c. Tipo de letra Comic Sans Serif, com tamanho 20, na cor azul e estilo itálico */
      #fonte-comic-italico {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        font-size: 20px;
        color: blue;
        font-style: italic;
      }

      /* d. Fonte de uma página na cor amarela, em negrito, tamanho 14, espessura média e tipo Verdana */
      #fonte-verdana-amarela {
        font-family: Verdana, Geneva, sans-serif;
        font-size: 14px;
        color: yellow;
        font-weight: 500; /* espessura média */
        font-style: normal;
      }

      body {
        background-color: #333; /* para a fonte amarela ficar visível */
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1 id="fonte-arial-vermelha">Texto com Arial e cor vermelha</h1>

    <p id="fonte-times-verde">Texto com Times, tamanho 22 e cor verde</p>

    <p id="fonte-comic-italico">
      Texto com Comic Sans, tamanho 20, azul e itálico
    </p>

    <p id="fonte-verdana-amarela">
      Texto com Verdana, tamanho 14, cor amarela, negrito e espessura média
    </p>
  </body>
</html>
